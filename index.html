<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quản Lý">
<title>Quản Lý</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--nen:#f3f6f4;--the:#fff;--chu:#0f1f17;--mo:#6b7a72;--vien:#e3ebe6;--vien2:#eef3f0;--xanh:#059669;--xanh-d:#047857;--xanh-n:#ecfdf5;--xanh-v:#a7f3d0;--toi:#0d1f17;--toi2:#163327;--duong:#2563eb;--duong-n:#eff6ff;--cam:#d97706;--cam-n:#fffbeb;--do:#dc2626;--do-n:#fef2f2;--tim:#7c3aed;--tim-n:#f5f3ff;--bong:0 1px 2px rgba(13,31,23,.05),0 6px 20px rgba(13,31,23,.05);--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nen);color:var(--chu);font:14px/1.45 "Be Vietnam Pro",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--vien);border-radius:11px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--xanh);box-shadow:0 0 0 4px rgba(5,150,105,.12)}
.so{font-variant-numeric:tabular-nums}
/* ===== khung ===== */
header{position:fixed;top:0;left:0;right:0;height:62px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--vien);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:20}
.logo{width:38px;height:38px;border-radius:22.5%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(5,150,105,.35);flex:none;overflow:hidden}.logo svg{width:100%;height:100%;display:block}
header h1{font-size:16.5px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
header h1 small{display:block;font-size:11.5px;font-weight:500;color:var(--mo);letter-spacing:0}
.hphai{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-h{display:flex;align-items:center;gap:7px;border:1.5px solid var(--vien);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.chip-h:hover{border-color:var(--xanh-v)}
.chip-h i{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex:none}
.chip-h.mo i{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.chip-h svg{width:16px;height:16px;color:var(--mo)}
#dongbo{width:9px;height:9px;border-radius:50%;background:#10b981;flex:none}
#dongbo.dang{background:#f59e0b}#dongbo.loi{background:#ef4444}
#mang-bao{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:40;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:calc(100% - 24px);text-align:center;cursor:default}
#mang-bao.mat{background:#1f2937;color:#fde68a}#mang-bao.cho{background:#fffbeb;color:#92400e;border:1px solid #fcd34d}#mang-bao.loi{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;cursor:pointer}#mang-bao[hidden]{display:none}
#dongho{font-weight:600;font-size:13px;color:var(--mo);white-space:nowrap}
nav{position:fixed;z-index:19;background:#fff}
nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:#4b5b53;cursor:pointer;font-weight:600;position:relative}
nav button svg{width:20px;height:20px;flex:none}
nav button .dem{background:var(--do);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;font-weight:700;line-height:17px}
main{padding:80px 18px 100px}
@media(min-width:768px){
  nav{top:62px;bottom:0;left:0;width:220px;padding:16px 12px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--vien)}
  nav button{padding:11px 14px;border-radius:12px;font-size:14px;width:100%}
  nav button:hover{background:var(--nen);color:var(--chu)}
  nav button.on{background:var(--xanh-n);color:var(--xanh-d)}
  nav button.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--xanh)}
  nav button .dem{margin-left:auto}
  main{padding:86px 26px 26px 246px}
}
@media(max-width:767px){
  nav{left:0;right:0;bottom:0;height:66px;display:flex;border-top:1px solid var(--vien);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:10.5px;padding:0;color:#7b8a82}
  nav button.on{color:var(--xanh)}
  nav button.on svg{background:var(--xanh-n);border-radius:10px;padding:3px;width:30px;height:26px;margin:-3px 0}
  nav button .dem{position:absolute;top:6px;left:50%;margin-left:6px}
  .an-dt{display:none!important}
  header{padding:0 12px;gap:9px}
  .chip-h{padding:6px 9px}
}
@media(min-width:768px){.an-pc{display:none!important}}
/* ===== thành phần ===== */
.the{background:var(--the);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--bong)}
.the h2{font-size:15.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.2px}
.the h2 small{color:var(--mo);font-weight:500;font-size:12.5px}
.the h2 .phai{margin-left:auto;display:flex;gap:6px}
.tieu-de{display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.tieu-de h2{font-size:21px;margin:0;font-weight:800;letter-spacing:-.4px}
.tieu-de .phai{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi .o{background:#fff;border-radius:var(--r);padding:16px;display:flex;gap:13px;align-items:center;box-shadow:var(--bong)}
.kpi .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi span{display:block;color:var(--mo);font-size:12.5px;font-weight:500}
.kpi b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px}
.c-xanh{background:var(--xanh-n);color:var(--xanh)}.c-duong{background:var(--duong-n);color:var(--duong)}.c-cam{background:var(--cam-n);color:var(--cam)}.c-do{background:var(--do-n);color:var(--do)}.c-tim{background:var(--tim-n);color:var(--tim)}.c-xam{background:#f1f5f3;color:#64748b}
.btn{border:1.5px solid var(--vien);background:#fff;border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:#cfdcd5;background:#fafcfb}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.chinh{background:linear-gradient(180deg,#10b981,#059669);border-color:#059669;color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.25)}.btn.chinh:hover{background:linear-gradient(180deg,#0ea472,#047857)}
.btn.toi{background:var(--toi);border-color:var(--toi);color:#fff}
.btn.do{color:var(--do);border-color:#fecaca}.btn.do:hover{background:var(--do-n)}
.btn.lon{width:100%;padding:14px;font-size:15.5px;border-radius:13px}
.btn.nho{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--vien);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;color:#3d4d45}
.chip.on{background:var(--toi);border-color:var(--toi);color:#fff}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.mo{color:var(--mo)}.nho{font-size:12.5px}
.trong{padding:30px 10px;text-align:center;color:var(--mo)}
.dong{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--vien2)}
.dong:last-child{border-bottom:0}
.dong .nd{flex:1;min-width:0}.dong .nd b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dong .nd small{color:var(--mo)}
.dong .so{font-weight:700;white-space:nowrap}
.bam{cursor:pointer;border-radius:10px}.bam:hover{background:#f7faf8}
table.bang{width:100%;border-collapse:collapse}
.bang th{text-align:left;font-size:12px;color:var(--mo);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--vien);white-space:nowrap}
.bang td{padding:10px;border-bottom:1px solid var(--vien2);vertical-align:middle}
.bang tr.bam:hover td{background:#f7faf8}
.r{text-align:right}.cuon{overflow-x:auto}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.luoi2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.luoi2>.the{margin-bottom:0}
label.f{display:block;margin-bottom:12px;font-size:12.5px;color:var(--mo);font-weight:600}
label.f input,label.f select,label.f textarea{margin-top:5px;color:var(--chu);font-size:14px;font-weight:400}
label.ck{display:flex;gap:9px;align-items:center;margin:8px 0;cursor:pointer}label.ck input{width:18px;height:18px;accent-color:var(--xanh)}
.do-chu{color:var(--do)}.xanh-chu{color:var(--xanh)}.cam-chu{color:var(--cam)}
.thumb{width:40px;height:40px;border-radius:10px;flex:none;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
/* ===== bán hàng ===== */
.pos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:768px){.pos{grid-template-columns:minmax(0,1fr) 390px;align-items:start}.gio-khung{position:sticky;top:86px;height:calc(100vh - 106px);display:flex;flex-direction:column}}
.timbox{position:relative;margin-bottom:12px}
.timbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mo)}
.timbox input{padding:13px 14px 13px 44px;font-size:15px;border-radius:13px;border-color:transparent;box-shadow:var(--bong)}
.timbox input:focus{border-color:var(--xanh)}
.timbox kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mo);border:1px solid var(--vien);border-radius:6px;padding:1px 6px;background:#f8faf9;font-family:inherit}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.sp{background:#fff;border:0;border-radius:15px;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;position:relative;box-shadow:var(--bong);overflow:hidden;transition:transform .12s,box-shadow .12s}
.sp:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(13,31,23,.06),0 12px 28px rgba(13,31,23,.10)}
.sp:active{transform:scale(.98)}
.sp .anh{aspect-ratio:16/10;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;letter-spacing:.5px;position:relative;overflow:hidden}
.sp .anh img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.sp .anh .het-phu{position:absolute;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center}
.sp .anh .het-phu span{background:var(--do);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.sp .tt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.sp .ten{font-weight:600;line-height:1.3;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.sp .duoi{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;gap:6px}
.sp .gia{font-weight:800;color:var(--xanh-d);font-size:15px}
.sp .ton{font-size:11px;color:var(--mo);white-space:nowrap}
.sp .ton.it{color:var(--cam);font-weight:600}
.ban-dau{position:sticky;top:62px;z-index:6;background:var(--nen);margin:-10px -4px 0;padding:10px 4px 2px}
.ban-dau .chips{margin-bottom:10px}.chip.xem-kieu{font-weight:700}
.ds-ban{display:flex;flex-direction:column;gap:6px}
.dsb{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--vien);border-radius:13px;padding:8px 10px;cursor:pointer;user-select:none}
.dsb:active{background:var(--xanh-n)}.dsb.co{border-color:#86efac;background:#f0fdf4}.dsb.het{opacity:.6}
.dsb .thumb{width:40px;height:40px;flex:none}.dsb .nd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dsb .nd b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dsb .nd small{font-size:11.5px;color:var(--mo)}.dsb .bc-chu{color:#c2410c;font-weight:700}
.dsb .gia{font-weight:800;color:var(--xanh-d);font-size:14.5px;white-space:nowrap}
.dsb .sl{background:#fff;border:1px solid #bbf7d0}.dsb .sl button{width:36px;height:36px;font-size:20px}.dsb .sl .so{min-width:28px;text-align:center;font-weight:800;font-size:15px}
.dsb .them1{width:38px;height:38px;border-radius:11px;border:0;background:var(--xanh);color:#fff;font-size:22px;font-weight:700;cursor:pointer;flex:none}
@media(max-width:600px){.luoi{grid-template-columns:repeat(3,1fr);gap:7px}.sp{border-radius:12px}.sp .anh{aspect-ratio:1/.8;font-size:17px}.sp .tt{padding:6px 7px 8px;gap:2px}.sp .ten{font-size:11.5px;min-height:30px;line-height:1.3}.sp .gia{font-size:12.5px}.sp .ton{display:none}
.sp .bot-gio{width:28px;height:28px;font-size:18px;top:4px;left:4px}.sp .sl-gio{top:5px;right:5px;min-width:22px;height:22px;font-size:11.5px;padding:0 5px}.luoi .sp .bc-tag{padding:1px 4px;left:4px;bottom:4px;font-size:11px}.luoi .sp .bc-tag i{display:none}
.gio-ds .sl button{width:40px;height:38px;font-size:21px}.gio-ds .sl .so{width:44px!important;font-size:16px}}
@media(max-width:340px){.luoi{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){body:has(.thanh-dt) #bao{bottom:150px!important}}
.chip.mon-khac{background:#fff7ed;color:#c2410c;border-color:#fed7aa;font-weight:700}
.sp .bc-tag i{font-style:normal}.sp .bc-tag{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:#c2410c;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;z-index:2}
.gm-ds{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px}.gm-ds button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--vien);border-radius:12px;background:#fff;cursor:pointer;text-align:left}.gm-ds button:hover{border-color:var(--xanh)}.gm-ds .nd{flex:1;display:flex;flex-direction:column}.gm-ds small{color:var(--mo);font-size:12px}
.mk-goi{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}.mk-goi button{padding:7px 12px;border-radius:99px;border:1px solid var(--vien);background:#fff;font-weight:700;cursor:pointer}
.sp .bot-gio{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:99px;background:#ef4444;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;line-height:1;z-index:3;box-shadow:0 2px 8px rgba(239,68,68,.45);border:2px solid #fff;cursor:pointer;user-select:none}.sp .bot-gio:hover{background:#dc2626}.sp .bot-gio:active{transform:scale(.9)}
.sp .sl-gio{position:absolute;top:8px;right:8px;background:var(--toi);color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:12.5px;font-weight:800;padding:0 7px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.gio-khung{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--bong)}
.gio-dau{padding:14px 16px 0;display:flex;align-items:center;gap:8px}
.gio-dau h3{margin:0;font-size:16px;font-weight:800}
.don-tabs{display:flex;gap:6px;padding:10px 16px 12px;overflow-x:auto;border-bottom:1px solid var(--vien2);scrollbar-width:none}
.don-tabs button{border:1.5px solid var(--vien);background:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--mo);white-space:nowrap}
.don-tabs button.on{background:var(--xanh-n);border-color:var(--xanh-v);color:var(--xanh-d)}
.gio-ds{flex:1;overflow-y:auto;min-height:140px}
.gl{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--vien2);align-items:center}
.gl .thumb{grid-row:span 2}
.gl .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl .x{border:0;background:none;color:#a3b1aa;cursor:pointer;padding:0 2px;font-size:15px;justify-self:end}
.gl .x:hover{color:var(--do)}
.gl .dg{color:var(--mo);font-size:12px;cursor:pointer;border-bottom:1px dashed #c5d3cb;margin-left:6px}
.gl .tt{font-weight:800;text-align:right}
.sl{display:inline-flex;align-items:center;background:var(--nen);border-radius:10px;overflow:hidden}
.sl button{width:30px;height:30px;border:0;background:none;cursor:pointer;font-size:17px;font-weight:700;color:var(--xanh-d)}
.sl button:hover{background:#e3ece7}
.sl input{width:46px;border:0;border-radius:0;text-align:center;padding:4px;font-weight:700;background:transparent}
.sl input:focus{box-shadow:none}
.gio-chan{padding:16px;background:var(--toi);color:#fff}
.gio-chan .hang{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#a7c4b5;margin-bottom:4px}
.gio-chan .tong{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 14px}
.gio-chan .tong span{font-weight:600}
.gio-chan .tong b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.gio-chan .btn.chinh{box-shadow:0 6px 18px rgba(16,185,129,.35)}
.gio-chan .btn.trang{background:transparent;border-color:#2f5444;color:#d1e7dc}
.gio-chan .btn.xoa{background:none;border:0;color:#f8a5a5;padding:2px 4px;font-size:12.5px}
.thanh-dt{position:fixed;left:10px;right:10px;bottom:76px;background:var(--toi);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;z-index:15;box-shadow:0 10px 30px rgba(13,31,23,.4)}
.thanh-dt b{font-size:18px;display:block}.thanh-dt .btn.trang-dt{background:transparent;border-color:#2f5444;color:#d1e7dc}.thanh-dt small{color:#a7c4b5}
@media(min-width:768px){.thanh-dt{display:none}}
@media(max-width:767px){.pos .gio-khung{display:none}.pos.xem-gio .gio-khung{display:flex;flex-direction:column;position:fixed;inset:62px 0 66px;z-index:16;border-radius:0}.pos.xem-gio .thanh-dt{display:none}}
/* ===== tổng quan ===== */
.hero{background:linear-gradient(135deg,#065f46 0%,#047857 45%,#10b981 100%);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(5,150,105,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .nhan{font-size:13px;color:#c9f2df;font-weight:600}
.hero .lon{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.hero .phu{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#d6f5e7}
